name: Bots scalping temps reel

#  ARRET DU LANCEMENT AUTOMATIQUE — 2026-08-12
#
#  Les trois strategies ont ete mesurees sur 73 instruments et 8 familles
#  d'actifs (devises majeures et croisees, metaux, energie, agricole,
#  indices, taux, crypto), soit 37 600 trades, avec des frais reels :
#
#      ote           -0,157 R par trade   0/8 familles positives
#      fvg_ifvg      -0,134 R par trade   0/8 familles positives
#      fibo_volume   -0,110 R par trade   1/6 familles positives
#
#  L'ampleur de la perte depasse ce que les frais expliquent : ces regles
#  perdent avant meme d'etre executees. Le taux de reussite d'ote est de
#  33,2 % alors qu'il en faut 40 pour un objectif a 1,5 fois le risque.
#
#  Le declencheur horaire est retire. `workflow_dispatch` reste : le
#  lancement manuel depuis l'onglet Actions fonctionne toujours, et
#  remettre la ligne `schedule` suffit a tout redemarrer.

on:
  workflow_dispatch:            # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: bots-live              # jamais deux sessions en parallèle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # coupe-circuit (< limite GitHub de 6h)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Git config
        run: |
          git config user.name  "scalping-bots"
          git config user.email "actions@github.com"

      - name: Run bots (~5h)
        env:
          GIT_PUSH: "1"
          MAX_RUNTIME: "17700"   # 4h55 : la session suivante prend le relais
        run: python run_bots.py

      - name: Commit final de securite
        if: always()
        run: |
          git add state trades 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Sauvegarde fin de session"
          git pull --rebase || true
          git push || true
